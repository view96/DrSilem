    </text>
    <text x="0" y="34" font-family="'Outfit', 'Cairo', sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8" letter-spacing="0.8">
      DR. AHMED SILEM DENTAL CLINIC
    </text>
    <text x="0" y="47" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="500" fill="#94a3b8">
