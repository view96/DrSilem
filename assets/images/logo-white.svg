<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="goldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Tooth Mark with stylized smile & care arc -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    <path d="M 21 16 C 16 16, 13 22, 14 28 C 15 35, 17 40, 20 48 C 22 52, 26 52, 27 46 C 28 41, 30 38, 30 38 C 30 38, 32 41, 33 46 C 34 52, 38 52, 40 48 C 43 40, 45 35, 46 28 C 47 22, 44 16, 39 16 C 34 16, 31 20, 30 20 C 29 20, 26 16, 21 16 Z" 
          fill="url(#logoWhiteGrad)" />
    <path d="M 22 28 Q 30 36 38 28" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M 44 14 L 46 10 L 48 14 L 52 16 L 48 18 L 46 22 L 44 18 L 40 16 Z" fill="url(#goldGradW)"/>
  </g>

  <!-- Typography: Clinic Name in Arabic and English for dark backgrounds -->
  <g transform="translate(80, 22)">
    <text x="0" y="16" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="0.5">
