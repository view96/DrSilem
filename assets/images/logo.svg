<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="50%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00a896" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Tooth Mark with stylized smile & care arc -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Tooth background shield -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#logoGrad)"/>
    <!-- Tooth outline and shine -->
    <path d="M 21 16 C 16 16, 13 22, 14 28 C 15 35, 17 40, 20 48 C 22 52, 26 52, 27 46 C 28 41, 30 38, 30 38 C 30 38, 32 41, 33 46 C 34 52, 38 52, 40 48 C 43 40, 45 35, 46 28 C 47 22, 44 16, 39 16 C 34 16, 31 20, 30 20 C 29 20, 26 16, 21 16 Z" 
          fill="#ffffff" />
    <!-- Dynamic smile curve inside tooth -->
    <path d="M 22 28 Q 30 36 38 28" fill="none" stroke="#00a896" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sparkling diamond star -->
    <path d="M 44 14 L 46 10 L 48 14 L 52 16 L 48 18 L 46 22 L 44 18 L 40 16 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography: Clinic Name in Arabic and English -->
  <g transform="translate(80, 22)">
    <!-- Brand Title -->
    <text x="0" y="16" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="800" fill="#0b2545" letter-spacing="0.5">
      د. أحـمـد رمـضـان سـلـيـم
    </text>
    <!-- Subtitle / Tagline -->
    <text x="0" y="34" font-family="'Outfit', 'Cairo', sans-serif" font-size="11.5" font-weight="600" fill="#028090" letter-spacing="0.8">
      DR. AHMED SILEM DENTAL CLINIC
    </text>
    <!-- Specialty -->
    <text x="0" y="47" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="500" fill="#64748b">
      طب وجراحة وتجميل الأسنان • الفيوم
    </text>
  </g>
</svg>
